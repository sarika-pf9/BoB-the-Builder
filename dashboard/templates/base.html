<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vjailbreak build dashboard{% endblock %}</title>
  <!-- Same cloud mascot as the header logo, on a small dark night-sky tile
       (matching the side decorations) so it stays visible in a browser tab
       regardless of whether the tab bar itself is light or dark. Inlined as
       a data URI - no separate .ico/.png file or static route needed. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0f1a'/><circle cx='16' cy='14' r='8' fill='%23eef2f7'/><circle cx='8' cy='17' r='5.5' fill='%23eef2f7'/><circle cx='24' cy='17' r='5.5' fill='%23eef2f7'/><rect x='4' y='15.5' width='24' height='9' rx='4.5' fill='%23eef2f7'/><rect x='8.5' y='13.5' width='6.5' height='4.5' rx='2.2' fill='%2320242c'/><rect x='17' y='13.5' width='6.5' height='4.5' rx='2.2' fill='%2320242c'/><rect x='15' y='15' width='2' height='1.5' rx='0.7' fill='%2320242c'/><path d='M11 21 Q16 24 21 21' stroke='%2320242c' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="side-deco side-deco-left" aria-hidden="true">
    <svg viewBox="0 0 120 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <!-- faint distant glow, the one place this still ties back to the
           brand accent color rather than plain starlight white -->
      <circle cx="40" cy="420" r="110" fill="currentColor" opacity="0.05"/>

      <g fill="#eef2f7">
        <circle cx="18" cy="35" r="0.9" opacity="0.35"/>
        <circle cx="70" cy="60" r="1.3" opacity="0.55"/>
        <circle cx="95" cy="25" r="0.8" opacity="0.3"/>
        <circle cx="40" cy="110" r="1" opacity="0.4"/>
        <circle cx="15" cy="170" r="1.5" opacity="0.65"/>
        <circle cx="85" cy="200" r="0.8" opacity="0.3"/>
        <circle cx="55" cy="250" r="1.1" opacity="0.45"/>
        <circle cx="20" cy="300" r="0.9" opacity="0.35"/>
        <circle cx="100" cy="330" r="1.6" opacity="0.7"/>
        <circle cx="65" cy="380" r="0.8" opacity="0.3"/>
        <circle cx="30" cy="440" r="1.2" opacity="0.5"/>
        <circle cx="90" cy="480" r="0.9" opacity="0.35"/>
        <circle cx="10" cy="530" r="1" opacity="0.4"/>
        <circle cx="60" cy="560" r="1.7" opacity="0.7"/>
        <circle cx="45" cy="610" r="0.8" opacity="0.3"/>
        <circle cx="95" cy="640" r="1.1" opacity="0.45"/>
        <circle cx="20" cy="690" r="1.3" opacity="0.55"/>
        <circle cx="75" cy="720" r="0.9" opacity="0.35"/>
        <circle cx="35" cy="760" r="1" opacity="0.4"/>
        <circle cx="90" cy="785" r="1.4" opacity="0.6"/>
      </g>

      <!-- a few softly-glowing stars (halo + bright core) for a little
           twinkle without adding motion/animation -->
      <circle cx="72" cy="150" r="6" fill="#eef2f7" opacity="0.06"/>
      <circle cx="72" cy="150" r="1.5" fill="#eef2f7" opacity="0.85"/>
      <circle cx="25" cy="470" r="6" fill="#eef2f7" opacity="0.06"/>
      <circle cx="25" cy="470" r="1.5" fill="#eef2f7" opacity="0.85"/>
      <circle cx="68" cy="700" r="6" fill="#eef2f7" opacity="0.06"/>
      <circle cx="68" cy="700" r="1.5" fill="#eef2f7" opacity="0.85"/>
    </svg>
  </div>
  <div class="side-deco side-deco-right" aria-hidden="true">
    <svg viewBox="0 0 120 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <circle cx="80" cy="480" r="110" fill="currentColor" opacity="0.05"/>

      <g fill="#eef2f7">
        <circle cx="100" cy="45" r="1" opacity="0.4"/>
        <circle cx="50" cy="80" r="0.8" opacity="0.3"/>
        <circle cx="25" cy="40" r="1.4" opacity="0.6"/>
        <circle cx="80" cy="130" r="0.9" opacity="0.35"/>
        <circle cx="105" cy="190" r="1.2" opacity="0.5"/>
        <circle cx="35" cy="220" r="0.8" opacity="0.3"/>
        <circle cx="65" cy="270" r="1.6" opacity="0.7"/>
        <circle cx="100" cy="310" r="0.9" opacity="0.35"/>
        <circle cx="20" cy="350" r="1.1" opacity="0.45"/>
        <circle cx="55" cy="400" r="0.8" opacity="0.3"/>
        <circle cx="95" cy="450" r="1.3" opacity="0.55"/>
        <circle cx="30" cy="490" r="0.9" opacity="0.35"/>
        <circle cx="70" cy="540" r="1" opacity="0.4"/>
        <circle cx="110" cy="580" r="1.7" opacity="0.7"/>
        <circle cx="45" cy="620" r="0.8" opacity="0.3"/>
        <circle cx="85" cy="660" r="1.2" opacity="0.5"/>
        <circle cx="15" cy="700" r="1" opacity="0.4"/>
        <circle cx="60" cy="730" r="0.9" opacity="0.35"/>
        <circle cx="100" cy="760" r="1.3" opacity="0.55"/>
        <circle cx="35" cy="790" r="0.9" opacity="0.35"/>
      </g>

      <circle cx="45" cy="110" r="6" fill="#eef2f7" opacity="0.06"/>
      <circle cx="45" cy="110" r="1.5" fill="#eef2f7" opacity="0.85"/>
      <circle cx="90" cy="380" r="6" fill="#eef2f7" opacity="0.06"/>
      <circle cx="90" cy="380" r="1.5" fill="#eef2f7" opacity="0.85"/>
      <circle cx="30" cy="650" r="6" fill="#eef2f7" opacity="0.06"/>
      <circle cx="30" cy="650" r="1.5" fill="#eef2f7" opacity="0.85"/>
    </svg>
  </div>
  <header>
    <a class="brand" href="/">
      <svg class="brand-logo" width="30" height="24" viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="13" r="10" fill="#eef2f7"/>
        <circle cx="13" cy="17" r="7" fill="#eef2f7"/>
        <circle cx="35" cy="17" r="7" fill="#eef2f7"/>
        <rect x="6" y="15" width="36" height="12" rx="6" fill="#eef2f7"/>
        <rect x="13" y="13" width="9" height="6" rx="3" fill="#20242c"/>
        <rect x="26" y="13" width="9" height="6" rx="3" fill="#20242c"/>
        <rect x="22" y="14.5" width="4" height="2" rx="1" fill="#20242c"/>
        <path d="M17 23 Q24 27 31 23" stroke="#20242c" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <span>vjailbreak build dashboard</span>
    </a>
    <span class="subtitle">proxy-24 &middot; build_system</span>
    <nav class="tabs">
      <a href="/" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
      <a href="/cleanup" class="{{ 'active' if active_page == 'cleanup' else '' }}">Cleanup</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
